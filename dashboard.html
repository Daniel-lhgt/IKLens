<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="IKLens — AI Prompt Studio Dashboard" />
  <meta name="theme-color" content="#07090e" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="images/IKLens - AI Image prompting platform.png" />
  <title>Dashboard — IKLens</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://iklens-9354a-default-rtdb.firebaseio.com" crossorigin />

  <!-- Design system -->
  <link rel="preload" as="style" href="js/design-system.css" />
  <link rel="stylesheet" href="js/design-system.css" />

  <!-- Module preloads (Lazy loading enabled for other views) -->
  <link rel="modulepreload" href="js/firebase-config.js" />
  <link rel="modulepreload" href="js/router.js" />
  <link rel="modulepreload" href="js/dashboard-boot.js" />
  <link rel="modulepreload" href="js/views/home.js" />
  <link rel="modulepreload" href="js/app.js" />

  <style>
    /* =========== SHELL TOKENS =========== */
    :root {
      --dash-bg: #07090e;
      --dash-surface: #0f131c;
      --dash-surface-elevated: #161c28;
      --dash-border: rgba(255, 255, 255, 0.08);
      --dash-text-primary: #f3f5f9;
      --dash-text-secondary: #94a3b8;
      --dash-text-muted: #64748b;
      --dash-cyan: #00d2ff;
      --dash-purple: #8a2be2;
      --dash-purple-light: #9d4edd;
      --dash-gradient: linear-gradient(135deg, var(--dash-purple), var(--dash-cyan));
      --dash-shadow-purple: 0 4px 16px rgba(138, 43, 226, 0.4);
      --dash-radius-sm: 8px;
      --dash-transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background-color: var(--dash-bg);
      color: var(--dash-text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .dash-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* Must clear the fixed bottom nav (~70px tall) plus breathing room,
         otherwise the last row of content is hidden behind it. */
      padding-bottom: calc(110px + var(--safe-bottom));
    }

    /* =========== HEADER =========== */
    .dash-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: transparent;
      /* Tighter header padding */
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: padding var(--dash-transition);
    }
    .dash-header.scrolled {
      padding: 10px 20px;
      background: rgba(7, 9, 14, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--dash-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .dash-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .dash-brand-logo {
      width: 34px;
      height: 34px;
      border-radius: var(--dash-radius-sm);
      object-fit: contain;
    }
    .dash-brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .dash-brand-title { font-size: 1.15rem; font-weight: 800; color: var(--dash-text-primary); }
    .dash-brand-subtitle { font-size: 0.7rem; color: var(--dash-text-secondary); font-weight: 500; }

    .dash-top-actions { display: flex; align-items: center; gap: 12px; }

    .dash-bell-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--dash-text-secondary);
      transition: background var(--dash-transition), color var(--dash-transition);
      cursor: pointer;
      text-decoration: none;
    }
    .dash-bell-btn:hover { background: var(--dash-surface-elevated); color: var(--dash-text-primary); }
    .dash-bell-icon { width: 20px; height: 20px; }
    .dash-bell-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #ef4444;
      color: white;
      font-size: 9px;
      font-weight: bold;
      min-width: 14px;
      height: 14px;
      padding: 0 4px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--dash-bg);
    }

    .dash-avatar-wrapper {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--dash-cyan), #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;
    }
    .dash-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }
    .dash-avatar-img.loaded { display: block; }
    .dash-avatar-fallback {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dash-text-primary);
      font-size: 16px;
      font-weight: 700;
      background: var(--dash-surface-elevated);
      border-radius: 50%;
    }

    /* =========== MAIN CONTENT =========== */
    .dash-main {
      flex: 1;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      /* Reduced from 28px to give content more breathing room */
      padding: 16px 20px;
    }

    /* Skeleton — hidden as soon as the first view mounts */
    #app-loading { display: block; }
    .dash-main:has(#app-content > *) #app-loading { display: none; }
    #app-loading[hidden] { display: none !important; }

    #app-content { min-height: 400px; width: 100%; }
    #app-content > [data-view] {
      animation: viewFadeIn 0.3s ease-out;
    }
    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* =========== SKELETON =========== */
    .dash-skeleton { display: flex; flex-direction: column; gap: 20px; padding: 8px 0; }
    .dash-skeleton-row {
      height: 24px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--dash-surface-elevated) 0%, #1f2738 50%, var(--dash-surface-elevated) 100%);
      background-size: 200% 100%;
      animation: dashShimmer 1.4s linear infinite;
    }
    .dash-skeleton-title { height: 32px; width: 60%; max-width: 320px; }
    .dash-skeleton-sub { height: 16px; width: 40%; max-width: 200px; margin-top: -8px; }
    .dash-skeleton-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }
    @media (min-width: 640px) {
      .dash-skeleton-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .dash-skeleton-card {
      aspect-ratio: 16 / 10;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--dash-surface-elevated) 0%, #1f2738 50%, var(--dash-surface-elevated) 100%);
      background-size: 200% 100%;
      animation: dashShimmer 1.4s linear infinite;
    }
    @keyframes dashShimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* =========== BOTTOM NAV (Smaller & Balanced) =========== */
    .dash-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding-bottom: max(0px, calc(var(--safe-bottom) - 5px));
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .dash-nav-container {
      width: 100%;
      max-width: 600px; /* Narrower max-width */
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
      background: rgba(15, 19, 28, 0.95);
      border: 1px solid var(--dash-border);
      border-radius: 20px; /* Smaller, sleeker border radius */
      padding: 8px 14px;  /* Reduced padding */
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }
    .dash-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--dash-text-muted);
      text-decoration: none;
      font-size: 0.65rem; /* Smaller text */
      font-weight: 500;
      padding: 6px 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      flex: 1;
      position: relative;
    }
    .dash-nav-item:hover { color: var(--dash-text-primary); }
    .dash-nav-icon { width: 20px; height: 20px; }
    .dash-nav-icon-wrap {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--dash-transition);
    }

    /* Active tab: the gradient bubble floats up, but the item's layout height
       is unchanged (negative margins), so all four labels stay on one line. */
    .dash-nav-item.active { color: #fff; }
    .dash-nav-item.active .dash-nav-icon-wrap {
      width: 46px;
      height: 46px;
      margin: -13px 0;
      transform: translateY(-12px);
      border-radius: 50%;
      background: var(--dash-gradient);
      box-shadow: var(--dash-shadow-purple);
    }
    .dash-nav-item.active .dash-nav-label {
      color: var(--dash-purple-light);
      font-weight: 600;
    }
    .dash-nav-item:not(.active) .dash-nav-label { color: var(--dash-text-secondary); }

    @media (min-width: 1024px) {
      .dash-bottom-nav { bottom: 24px; }
      .dash-nav-container { padding: 10px 20px; }
      .dash-wrapper { padding-bottom: 140px; }
    }

    /* =========== NOSCRIPT BANNER =========== */
    .noscript-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #ef4444;
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      z-index: 99999;
      font-size: 0.9rem;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <noscript>
    <div class="noscript-banner">
      IKLens requires JavaScript. Please enable it in your browser to continue.
    </div>
  </noscript>

  <div class="dash-wrapper">

    <!-- =========== HEADER =========== -->
    <header class="dash-header" id="dash-header">
      <a href="#/home" class="dash-brand" data-route="home" aria-label="IKLens Home">
        <img
          src="images/IKLens - AI Image prompting platform.png"
          alt="IKLens Logo"
          class="dash-brand-logo"
          fetchpriority="high"
          decoding="async"
        />
        <div class="dash-brand-text">
          <span class="dash-brand-title">IKLens</span>
          <span class="dash-brand-subtitle">AI Prompt Studio</span>
        </div>
      </a>

      <div class="dash-top-actions">
        <a href="#/notification" class="dash-bell-btn" data-route="notification" title="Notifications" aria-label="Notifications">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="dash-bell-icon" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="dash-bell-badge" id="dash-bell-badge" style="display:none;">0</span>
        </a>

        <a href="#/profile" class="dash-avatar-wrapper" data-route="profile" title="Profile" aria-label="User Profile">
          <img alt="User Avatar" class="dash-avatar-img" id="user-avatar" loading="lazy" decoding="async" />
          <div class="dash-avatar-fallback" id="avatar-fallback">U</div>
        </a>
      </div>
    </header>

    <!-- =========== MAIN =========== -->
    <main class="dash-main">
      <!-- Loading skeleton — hidden the moment #app-content gets a child -->
      <div id="app-loading" aria-live="polite" aria-label="Loading dashboard">
        <div class="dash-skeleton">
          <div class="dash-skeleton-row dash-skeleton-title"></div>
          <div class="dash-skeleton-row dash-skeleton-sub"></div>
          <div class="dash-skeleton-grid">
            <div class="dash-skeleton-card"></div>
            <div class="dash-skeleton-card"></div>
            <div class="dash-skeleton-card"></div>
          </div>
        </div>
      </div>

      <!-- View container — router appends view nodes here -->
      <div id="app-content"></div>
    </main>

    <!-- =========== BOTTOM NAV =========== -->
    <nav class="dash-bottom-nav" aria-label="Main Navigation">
      <div class="dash-nav-container">
        <a href="#/home" class="dash-nav-item active" data-route="home" aria-label="Home">
          <div class="dash-nav-icon-wrap">
            <svg class="dash-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 011 1m-6 0h6"/></svg>
          </div>
          <span class="dash-nav-label">Home</span>
        </a>
        <a href="#/gallery" class="dash-nav-item" data-route="gallery" aria-label="Gallery">
          <div class="dash-nav-icon-wrap">
            <svg class="dash-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          </div>
          <span class="dash-nav-label">Gallery</span>
        </a>
        <a href="#/explore" class="dash-nav-item" data-route="explore" aria-label="Explore">
          <div class="dash-nav-icon-wrap">
            <svg class="dash-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>
          <span class="dash-nav-label">Explore</span>
        </a>
        <a href="#/profile" class="dash-nav-item" data-route="profile" aria-label="Profile">
          <div class="dash-nav-icon-wrap">
            <svg class="dash-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </div>
          <span class="dash-nav-label">Profile</span>
        </a>
      </div>
    </nav>

    <!-- Skeleton fallback for older browsers -->
    <script>
      (function () {
        if (window.CSS && CSS.supports && CSS.supports("selector(:has(*))")) {
          return; 
        }
        var content = document.getElementById("app-content");
        var loading = document.getElementById("app-loading");
        if (!content || !loading) return;

        var hideLoading = function () {
          if (content.children.length > 0) {
            loading.hidden = true;
            mo.disconnect();
          }
        };

        var mo = new MutationObserver(hideLoading);
        mo.observe(content, { childList: true });
        hideLoading(); 
      })();
    </script>

    <script type="module" src="js/dashboard-boot.js"></script>
    <script type="module" src="js/app.js"></script>
  </div>
</body>
</html>
