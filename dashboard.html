<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="IKLens — AI Prompt Studio Dashboard" />
  <meta name="theme-color" content="#07090e" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="images/IKLens - AI Image prompting platform.png" />
  <title>Dashboard — IKLens</title>
  <style>
    :root {
      --dash-bg: #07090e;
      --dash-surface: #0f131c;
      --dash-surface-elevated: #161c28;
      --dash-surface-hover: #1c2434;
      --dash-border: rgba(255, 255, 255, 0.08);
      --dash-border-hover: rgba(255, 255, 255, 0.16);
      --dash-border-focus: rgba(0, 210, 255, 0.5);
      --dash-text-primary: #f3f5f9;
      --dash-text-secondary: #94a3b8;
      --dash-text-muted: #64748b;
      --dash-cyan: #00d2ff;
      --dash-purple: #8a2be2;
      --dash-purple-light: #9d4edd;
      --dash-gradient: linear-gradient(135deg, var(--dash-purple), var(--dash-cyan));
      --dash-shadow-purple: 0 4px 20px rgba(138, 43, 226, 0.35);
      --dash-radius-sm: 8px;
      --dash-radius-md: 14px;
      --dash-radius-lg: 20px;
      --dash-radius-full: 9999px;
      --dash-transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background-color: var(--dash-bg);
      color: var(--dash-text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }

    .dash-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: calc(80px + var(--safe-bottom));
    }

    /* HEADER */
    .dash-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: transparent;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: padding var(--dash-transition);
    }

    .dash-header.scrolled {
      padding: 12px 28px;
      background-color: rgba(7, 9, 14, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--dash-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .dash-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: opacity var(--dash-transition);
    }

    .dash-brand:hover { opacity: 0.85; }

    .dash-brand-logo {
      width: 38px;
      height: 38px;
      border-radius: var(--dash-radius-sm);
      object-fit: contain;
    }

    .dash-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .dash-brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--dash-text-primary);
    }

    .dash-brand-subtitle {
      font-size: 0.75rem;
      color: var(--dash-text-secondary);
      font-weight: 500;
    }

    /* AVATAR */
    .dash-avatar-wrapper {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: var(--dash-radius-full);
      padding: 2px;
      background: linear-gradient(135deg, var(--dash-cyan), #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform var(--dash-transition), box-shadow var(--dash-transition);
      overflow: hidden;
    }

    .dash-avatar-wrapper:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
    }

    .dash-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--dash-surface-elevated);
      display: none;
    }

    .dash-avatar-img.loaded { display: block; }
    .dash-avatar-img.error { display: none; }

    .dash-avatar-fallback {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dash-text-primary);
      font-size: 18px;
      font-weight: 700;
      background: var(--dash-surface-elevated);
      border-radius: 50%;
    }

    /* MAIN */
    .dash-main {
      flex: 1;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px;
    }

    #app-content {
      min-height: 400px;
      width: 100%;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* DASHBOARD INITIAL SKELETON (shown only on first visit ever) */
    .dash-skeleton {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 8px 0;
    }

    .dash-skeleton-row {
      border-radius: var(--dash-radius-md);
      background: linear-gradient(
        90deg,
        var(--dash-surface-elevated) 0%,
        #1f2738 50%,
        var(--dash-surface-elevated) 100%
      );
      background-size: 200% 100%;
      animation: dashShimmer 1.4s linear infinite;
    }

    .dash-skeleton-title {
      height: 32px;
      width: 60%;
      max-width: 320px;
      border-radius: 8px;
    }

    .dash-skeleton-sub {
      height: 16px;
      width: 40%;
      max-width: 200px;
      border-radius: 6px;
      margin-top: -8px;
    }

    .dash-skeleton-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    @media (min-width: 640px) {
      .dash-skeleton-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .dash-skeleton-card {
      aspect-ratio: 3 / 4;
      border-radius: var(--dash-radius-md);
      background: linear-gradient(
        90deg,
        var(--dash-surface-elevated) 0%,
        #1f2738 50%,
        var(--dash-surface-elevated) 100%
      );
      background-size: 200% 100%;
      animation: dashShimmer 1.4s linear infinite;
    }

    @keyframes dashShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* BOTTOM NAV */
    .dash-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: transparent;
      border-top: none;
      padding: 0;
      padding-bottom: calc(10px + var(--safe-bottom));
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .dash-nav-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
      background: rgba(15, 19, 28, 0.95);
      border: 1px solid var(--dash-border);
      border-radius: var(--dash-radius-full);
      padding: 12px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .dash-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--dash-text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 8px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all var(--dash-transition);
      user-select: none;
      flex: 1;
      position: relative;
      top: 0;
    }

    .dash-nav-item:hover {
      color: var(--dash-text-primary);
      transform: translateY(-2px);
    }

    .dash-nav-icon {
      width: 24px;
      height: 24px;
      transition: transform var(--dash-transition);
    }

    .dash-nav-item.active {
      position: relative;
      top: -18px;
      padding: 0;
      color: #fff;
    }

    .dash-nav-item.active .dash-nav-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: var(--dash-radius-full);
      background: var(--dash-gradient);
      box-shadow: var(--dash-shadow-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(1);
      transition: transform var(--dash-transition), box-shadow var(--dash-transition);
    }

    .dash-nav-item.active:hover .dash-nav-icon-wrap {
      transform: scale(1.1) translateY(-3px);
      box-shadow: 0 10px 35px rgba(138, 43, 226, 0.6);
    }

    .dash-nav-item.active .dash-nav-icon { transform: scale(1); }

    .dash-nav-item.active .dash-nav-label {
      margin-top: 4px;
      color: var(--dash-purple-light);
      font-weight: 600;
    }

    .dash-nav-item:not(.active) .dash-nav-label {
      color: var(--dash-text-secondary);
    }

    @media (min-width: 1024px) {
      .dash-bottom-nav { bottom: 24px; }
      .dash-nav-container { padding: 14px 40px; }
      .dash-nav-item.active { top: -18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="dash-wrapper">
    <!-- HEADER -->
    <header class="dash-header" id="dash-header">
      <a href="#/home" class="dash-brand" data-route="home" aria-label="IKLens Home">
        <img
          src="images/IKLens - AI Image prompting platform.png"
          alt="IKLens Logo"
          class="dash-brand-logo"
          loading="lazy"
        />
        <div class="dash-brand-text">
          <span class="dash-brand-title">IKLens</span>
          <span class="dash-brand-subtitle">AI Prompt Studio</span>
        </div>
      </a>

      <a href="#/profile" class="dash-avatar-wrapper" data-route="profile" title="Profile" aria-label="User Profile">
        <img alt="User Avatar" class="dash-avatar-img" id="user-avatar" loading="lazy" />
        <div class="dash-avatar-fallback" id="avatar-fallback">U</div>
      </a>
    </header>

    <!-- MAIN -->
    <main class="dash-main">
      <div id="app-content"></div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="dash-bottom-nav" aria-label="Main Navigation">
      <div class="dash-nav-container">
        <a href="#/home" class="dash-nav-item active" data-route="home" aria-label="Home">
          <div class="dash-nav-icon-wrap">
            <svg class="dash-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 011 1m-6 0h6"/>
            </svg>
          </div>
          <span class="dash-nav-label">Home</span>
        </a>

        <a href="#/gallery" class="dash-nav-item" data-route="gallery" aria-label="Gallery">
          <div class="dash-nav-icon-wrap">
            <svg class="dash-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
          <span class="dash-nav-label">Gallery</span>
        </a>

        <a href="#/profile" class="dash-nav-item" data-route="profile" aria-label="Profile">
          <div class="dash-nav-icon-wrap">
            <svg class="dash-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <span class="dash-nav-label">Profile</span>
        </a>
      </div>
    </nav>

    <!-- DASHBOARD SCRIPT — instant-paint version -->
    <script type="module">
      import { onAuthStateChanged } from
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

      import {
        ref,
        get
      } from
        "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

      import { auth, database } from "./js/firebase-config.js";

      const avatarImg = document.getElementById("user-avatar");
      const avatarFallback = document.getElementById("avatar-fallback");
      const appContent = document.getElementById("app-content");

      const USER_CACHE_KEY = "iklens_user_cache_v1";

      /* ---------- ERROR REDIRECT ---------- */
      function redirectToError(message, code = "DASHBOARD_ERROR") {
        const errorURL = new URL("error.html", document.baseURI);
        errorURL.searchParams.set("message", message);
        errorURL.searchParams.set("code", code);
        errorURL.searchParams.set("from", "home");
        window.location.replace(errorURL.href);
      }

      /* ---------- HELPERS ---------- */
      function getInitials(name) {
        return String(name || "User")
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map(part => part.charAt(0).toUpperCase())
          .join("") || "U";
      }

      function firstString(...values) {
        return values.find(
          v => typeof v === "string" && v.trim()
        )?.trim() || "";
      }

      /* ---------- CACHED USER ---------- */
      function readCachedUser() {
        try {
          const raw = localStorage.getItem(USER_CACHE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return null;
          return parsed;
        } catch {
          return null;
        }
      }

      function writeCachedUser(data) {
        try {
          localStorage.setItem(USER_CACHE_KEY, JSON.stringify(data));
        } catch {}
      }

      function clearCachedUser() {
        try { localStorage.removeItem(USER_CACHE_KEY); } catch {}
      }

      /* ---------- AVATAR PAINT ---------- */
      function paintAvatar(displayName, photoURL) {
        avatarFallback.textContent = getInitials(displayName);
        avatarFallback.style.display = "flex";
        avatarImg.alt = `${displayName}'s avatar`;
        avatarImg.classList.remove("loaded", "error");
        avatarImg.removeAttribute("src");

        if (photoURL) {
          avatarImg.onload = () => {
            avatarImg.classList.add("loaded");
            avatarImg.classList.remove("error");
            avatarFallback.style.display = "none";
          };

          avatarImg.onerror = () => {
            avatarImg.classList.add("error");
            avatarImg.classList.remove("loaded");
            avatarFallback.style.display = "flex";
          };

          avatarImg.src = photoURL;
        } else {
          avatarImg.classList.add("error");
          avatarImg.classList.remove("loaded");
        }
      }

      /* ---------- SKELETON ---------- */
      function showDashboardSkeleton() {
        appContent.innerHTML = `
          <div class="dash-skeleton" aria-hidden="true">
            <div class="dash-skeleton-row dash-skeleton-title"></div>
            <div class="dash-skeleton-row dash-skeleton-sub"></div>
            <div class="dash-skeleton-grid">
              <div class="dash-skeleton-card"></div>
              <div class="dash-skeleton-card"></div>
              <div class="dash-skeleton-card"></div>
              <div class="dash-skeleton-card"></div>
              <div class="dash-skeleton-card"></div>
              <div class="dash-skeleton-card"></div>
            </div>
          </div>
        `;
      }

      /* ---------- GUARD ---------- */
      if (!avatarImg || !avatarFallback || !appContent) {
        redirectToError(
          "The dashboard could not load correctly. Please try again.",
          "DASHBOARD_ELEMENTS_MISSING"
        );
      } else {
        /* ---------- INSTANT PAINT FROM CACHE ---------- */
        const cached = readCachedUser();

        if (cached) {
          // Show avatar immediately from cache.
          paintAvatar(cached.name || "User", cached.photoURL || "");
        } else {
          // First visit ever — show a friendly skeleton
          // in the app content area until auth resolves.
          showDashboardSkeleton();
        }

        /* ---------- VERIFY WITH FIREBASE ---------- */
        const unsubscribe = onAuthStateChanged(
          auth,
          async (user) => {
            if (!user) {
              clearCachedUser();
              window.location.replace("login.html");
              return;
            }

            try {
              // Start with Firebase Auth data.
              let displayName =
                user.displayName ||
                user.email?.split("@")[0] ||
                "User";

              let photoURL = user.photoURL || "";

              // Fetch saved profile.
              const profileRef = ref(
                database,
                `users/${user.uid}/profile`
              );

              let snapshot = await get(profileRef);
              let profile = null;

              if (snapshot.exists()) {
                profile = snapshot.val() || {};
              } else {
                const userSnapshot = await get(
                  ref(database, `users/${user.uid}`)
                );

                if (userSnapshot.exists()) {
                  profile = userSnapshot.val() || {};
                  if (
                    profile.profile &&
                    typeof profile.profile === "object"
                  ) {
                    profile = { ...profile, ...profile.profile };
                  }
                }
              }

              if (profile) {
                displayName = firstString(
                  profile.name,
                  profile.fullName,
                  profile.displayName,
                  displayName
                );

                photoURL = firstString(
                  profile.photoURL,
                  profile.avatarURL,
                  profile.avatarUrl,
                  photoURL
                );
              }

              // Update cache + paint.
              writeCachedUser({
                name: displayName,
                photoURL,
                uid: user.uid
              });

              paintAvatar(displayName, photoURL);

            } catch (error) {
              console.error(
                "[IKLens Dashboard] Could not load profile:",
                error
              );

              const fallbackName =
                user.displayName ||
                user.email?.split("@")[0] ||
                "User";

              paintAvatar(fallbackName, "");
            }
          },

          (error) => {
            console.error(
              "[IKLens Dashboard] Authentication check failed:",
              error
            );

            redirectToError(
              "We couldn't verify your sign-in session. Please try again.",
              "AUTH_CHECK_FAILED"
            );
          }
        );

        window.addEventListener("pagehide", () => {
          try { unsubscribe(); } catch (_) {}
        });
      }
    </script>

    <script src="js/router.js" type="module"></script>
    <script src="js/app.js" type="module"></script>
  </div>
</body>
</html>
