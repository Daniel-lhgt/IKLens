<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050714" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="images/IKLens - AI Image prompting platform.png" />
  <title>Generate Prompt — IKLens</title>
  <style>
    :root {
      --ik-bg: #050714;
      --ik-surface: #0f1223;
      --ik-card: #151a30;
      --ik-border: rgba(124, 138, 255, 0.12);
      --ik-accent: #7c8aff;
      --ik-accent-soft: rgba(124, 138, 255, 0.15);
      --ik-accent-bright: #a5aeff;
      --ik-text: #eef0ff;
      --ik-text-secondary: #b0b8e6;
      --ik-text-muted: #6b72b0;
      --ik-success: #34d399;
      --ik-error: #f87171;

      --ik-gradient: linear-gradient(135deg, #8a2be2 0%, #00d2ff 100%);
      --ik-gradient-hover: linear-gradient(135deg, #9d4beb 0%, #33dfff 100%);

      --ik-radius: 12px;
      --ik-radius-lg: 16px;
      --ik-radius-xl: 22px;
      --ik-pill: 9999px;
      --ik-transition: 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      --ik-shadow-glow: 0 8px 28px rgba(138, 43, 226, 0.35);

      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--ik-bg);
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--ik-text);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP BAR */
    .gen-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: calc(14px + var(--safe-top)) 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .gen-topbar-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: var(--ik-text);
      font-size: 1.5rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      transition: background var(--ik-transition);
      flex-shrink: 0;
    }

    .gen-topbar-btn:hover { background: rgba(255, 255, 255, 0.08); }

    .gen-topbar-title {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ik-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Layout */
    .gen-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 14px 14px 24px;
      position: relative;
    }

    /* STATES */
    .gen-state {
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: genFade 0.35s ease-out;
    }

    .gen-state[hidden] { display: none !important; }

    @keyframes genFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .gen-image-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 72vh;
      background: #000;
      border-radius: var(--ik-radius-xl);
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .gen-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gen-image[hidden] { display: none; }

    .gen-image-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--ik-text-muted);
      font-size: 0.9rem;
      background: var(--ik-surface);
    }

    .gen-image-placeholder[hidden] { display: none; }

    .gen-image-placeholder-icon {
      font-size: 2.4rem;
      opacity: 0.6;
    }

    .gen-ref-tag {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 6px 14px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 500;
      border-radius: var(--ik-pill);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 2;
    }

    .gen-ref-tag[hidden] { display: none; }

    /* PROMPT SECTION */
    .gen-prompt-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gen-prompt-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--ik-text-secondary);
      text-transform: uppercase;
    }

    .gen-prompt-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2a2350, #1b1e3a);
      border: 1px solid rgba(138, 43, 226, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(138, 43, 226, 0.18);
    }

    .gen-prompt-body {
      background: #0d1020;
      border: 1px solid rgba(124, 138, 255, 0.14);
      border-radius: var(--ik-radius-xl);
      padding: 22px 20px;
      min-height: 180px;
      max-height: 52vh;
      overflow-y: auto;
      color: var(--ik-text);
      font-size: 0.98rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      scrollbar-width: thin;
      scrollbar-color: rgba(124, 138, 255, 0.3) transparent;
    }

    .gen-prompt-body::-webkit-scrollbar { width: 6px; }
    .gen-prompt-body::-webkit-scrollbar-track { background: transparent; }
    .gen-prompt-body::-webkit-scrollbar-thumb {
      background: rgba(124, 138, 255, 0.25);
      border-radius: 3px;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--ik-accent-bright);
      margin-left: 2px;
      animation: blink 0.9s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ACTION ROW */
    .gen-action-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding-top: 4px;
    }

    .gen-action-row[hidden] { display: none !important; }

    /* WIDE PRIMARY BUTTON (Generate / Copy) */
    .gen-btn-primary {
      flex: 1;
      min-height: 56px;
      padding: 14px 24px;
      border: none;
      border-radius: var(--ik-pill);
      background: var(--ik-gradient);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--ik-shadow-glow);
      transition: transform var(--ik-transition), box-shadow var(--ik-transition), opacity 0.2s, background var(--ik-transition);
      font-family: inherit;
    }

    .gen-btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--ik-gradient-hover);
      box-shadow: 0 12px 32px rgba(138, 43, 226, 0.5);
    }

    .gen-btn-primary:active:not(:disabled) { transform: translateY(0); }

    .gen-btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* ICON BUTTON (Regenerate) */
    .gen-btn-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid rgba(124, 138, 255, 0.3);
      background: rgba(124, 138, 255, 0.1);
      color: var(--ik-accent-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      cursor: pointer;
      transition: background var(--ik-transition), border-color var(--ik-transition), transform var(--ik-transition), opacity 0.2s;
      flex-shrink: 0;
    }

    .gen-btn-icon:hover:not(:disabled) {
      background: rgba(124, 138, 255, 0.2);
      border-color: rgba(124, 138, 255, 0.5);
      transform: translateY(-1px);
    }

    .gen-btn-icon:active:not(:disabled) { transform: translateY(0); }
    .gen-btn-icon:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .gen-btn-icon .btn-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(165, 174, 255, 0.3);
      border-top-color: var(--ik-accent-bright);
    }

    /* Spinner inside buttons */
    .btn-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .copy-toast {
      position: fixed;
      bottom: calc(90px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(20, 24, 40, 0.95);
      border: 1px solid rgba(124, 138, 255, 0.35);
      color: var(--ik-success);
      padding: 10px 20px;
      border-radius: var(--ik-pill);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 500;
      white-space: nowrap;
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Error */
    .gen-error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: var(--ik-error);
      padding: 12px 16px;
      border-radius: var(--ik-radius);
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }

    .gen-error.visible { display: block; }

    /* Loading */
    .gen-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 50vh;
      color: var(--ik-text-muted);
      font-size: 0.9rem;
    }

    .gen-loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(124, 138, 255, 0.15);
      border-top-color: var(--ik-accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .gen-loading[hidden] { display: none !important; }

    @media (min-width: 640px) {
      .gen-shell { padding: 20px 20px 32px; }
      .gen-image-frame { max-height: 68vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .typing-cursor { animation: none; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="gen-topbar">
    <button class="gen-topbar-btn" id="backBtn" aria-label="Go back">‹</button>
    <h1 class="gen-topbar-title" id="topbarTitle">Generate Prompt</h1>
    <span class="gen-topbar-btn" aria-hidden="true"></span>
  </header>

  <main class="gen-shell">

    <!-- Loading -->
    <div class="gen-loading" id="loadingState">
      <div class="gen-loading-spinner"></div>
      <span>Loading template…</span>
    </div>

    <!-- Error -->
    <div class="gen-error" id="errorBox" role="alert"></div>

    <!-- STATE 1 — PRE-GENERATE -->
    <section class="gen-state" id="statePreview" hidden>
      <div class="gen-image-frame">
        <img id="previewImage" class="gen-image" alt="Template preview" loading="eager" decoding="async" />
        <div class="gen-image-placeholder" id="previewPlaceholder" hidden>
          <span class="gen-image-placeholder-icon">🖼️</span>
          <span>No preview available</span>
        </div>
      </div>

      <div class="gen-action-row">
        <button type="button" class="gen-btn-primary" id="generateBtn">
          <span id="generateBtnLabel">Generate</span>
        </button>
      </div>
    </section>

    <!-- STATE 2 — POST-GENERATE -->
    <section class="gen-state" id="stateResult" hidden>
      <div class="gen-image-frame">
        <img id="resultImage" class="gen-image" alt="Reference image" loading="lazy" decoding="async" />
        <div class="gen-image-placeholder" id="resultPlaceholder" hidden>
          <span class="gen-image-placeholder-icon">🖼️</span>
          <span>No preview available</span>
        </div>
        <span class="gen-ref-tag" id="referenceTag" hidden>Reference</span>
      </div>

      <div class="gen-prompt-section">
        <div class="gen-prompt-label">
          <span class="gen-prompt-icon">✨</span>
          <span>AI Prompt</span>
        </div>
        <div class="gen-prompt-body" id="promptOutput" aria-live="polite" aria-busy="false"></div>
      </div>

      <div class="gen-action-row">
        <button
          type="button"
          class="gen-btn-icon"
          id="regenerateBtn"
          aria-label="Regenerate prompt"
          title="Regenerate"
        >
          <span id="regenerateBtnIcon" aria-hidden="true">🔁</span>
        </button>

        <button
          type="button"
          class="gen-btn-primary"
          id="copyBtn"
        >
          <span>📋 Copy Prompt</span>
        </button>
      </div>
    </section>

  </main>

  <!-- Toast -->
  <div class="copy-toast" id="copyToast" role="status" aria-live="polite">
    ✅ Copied to clipboard
  </div>

<script type="module">
  import {
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

  import { database } from "./js/firebase-config.js";

  /* =====================================
     STATE
  ===================================== */
  const STATE = {
    templateId: null,
    templateData: null,
    fullPromptText: "",
    isGenerating: false,
    isRevealed: false
  };

  /* =====================================
     DOM
  ===================================== */
  const els = {
    backBtn: document.getElementById("backBtn"),
    topbarTitle: document.getElementById("topbarTitle"),
    loadingState: document.getElementById("loadingState"),
    errorBox: document.getElementById("errorBox"),

    statePreview: document.getElementById("statePreview"),
    previewImage: document.getElementById("previewImage"),
    previewPlaceholder: document.getElementById("previewPlaceholder"),
    generateBtn: document.getElementById("generateBtn"),
    generateBtnLabel: document.getElementById("generateBtnLabel"),

    stateResult: document.getElementById("stateResult"),
    resultImage: document.getElementById("resultImage"),
    resultPlaceholder: document.getElementById("resultPlaceholder"),
    referenceTag: document.getElementById("referenceTag"),
    promptOutput: document.getElementById("promptOutput"),
    copyBtn: document.getElementById("copyBtn"),
    regenerateBtn: document.getElementById("regenerateBtn"),
    regenerateBtnIcon: document.getElementById("regenerateBtnIcon"),

    copyToast: document.getElementById("copyToast")
  };

  /* =====================================
     HELPERS
  ===================================== */
  function getTemplateIdFromURL() {
    const params = new URLSearchParams(window.location.search);
    return (params.get("template") || "").trim();
  }

  function safeImageUrl(url) {
    if (typeof url !== "string") return "";
    const trimmed = url.trim();
    if (!trimmed) return "";

    if (
      /^https?:\/\//i.test(trimmed) ||
      /^\/[^/]/.test(trimmed) ||
      /^images\//i.test(trimmed) ||
      /^\.\.?\//.test(trimmed)
    ) {
      return trimmed;
    }
    return "";
  }

  function showError(msg) {
    els.errorBox.textContent = "⚠️ " + msg;
    els.errorBox.classList.add("visible");
  }

  function hideError() {
    els.errorBox.classList.remove("visible");
    els.errorBox.textContent = "";
  }

  function showOnly(state) {
    // "preview" | "result" | "loading" | "none"
    els.loadingState.hidden = state !== "loading";
    els.statePreview.hidden = state !== "preview";
    els.stateResult.hidden = state !== "result";
  }

  function setTopbarTitle(text) {
    els.topbarTitle.textContent = text;
  }

  function showCopyToast() {
    els.copyToast.classList.add("show");
    clearTimeout(showCopyToast._t);
    showCopyToast._t = setTimeout(() => {
      els.copyToast.classList.remove("show");
    }, 2200);
  }

  function goBack() {
    if (window.history.length > 1) {
      history.back();
    } else {
      window.location.href = "dashboard.html#/gallery";
    }
  }

  /* =====================================
     LOAD TEMPLATE
  ===================================== */
  async function loadTemplate() {
    STATE.templateId = getTemplateIdFromURL();

    if (!STATE.templateId) {
      showOnly("none");
      setTopbarTitle("Template");
      showError("No template was selected. Go back to the gallery and pick one.");
      return;
    }

    showOnly("loading");
    hideError();

    try {
      const snap = await get(
        ref(database, `templates/${STATE.templateId}`)
      );

      if (!snap.exists()) {
        showOnly("none");
        showError("This template is no longer available.");
        return;
      }

      const data = snap.val() || {};

      STATE.templateData = {
        id: STATE.templateId,
        name: typeof data.name === "string" ? data.name : "",
        category: typeof data.category === "string" ? data.category : "",
        image: typeof data.image === "string" ? data.image : "",
        prompt: typeof data.prompt === "string" ? data.prompt : ""
      };

      renderPreview();

    } catch (error) {
      console.error("[IKLens Generate] Failed to load template:", error);
      showOnly("none");
      showError("We couldn't load this template. Please try again.");
    }
  }

  /* =====================================
     STATE 1 — PREVIEW
  ===================================== */
  function renderPreview() {
    const t = STATE.templateData;

    setTopbarTitle("Generate Prompt");

    setupImage(els.previewImage, els.previewPlaceholder, t.image, t.name);

    els.generateBtn.disabled = false;
    els.generateBtnLabel.textContent = "Generate";

    showOnly("preview");
  }

  /* =====================================
     STATE 2 — RESULT
  ===================================== */
  function renderResult() {
    const t = STATE.templateData;

    setTopbarTitle("AI Prompt");

    setupImage(els.resultImage, els.resultPlaceholder, t.image, t.name);

    els.referenceTag.hidden = !safeImageUrl(t.image);

    els.promptOutput.textContent = "";
    els.promptOutput.setAttribute("aria-busy", "true");

    els.regenerateBtn.disabled = false;
    els.regenerateBtnIcon.textContent = "🔁";

    showOnly("result");
  }

  /* =====================================
     IMAGE SETUP
  ===================================== */
  function setupImage(imgEl, placeholderEl, url, altText) {
    const safeUrl = safeImageUrl(url);

    imgEl.hidden = true;
    imgEl.removeAttribute("src");
    placeholderEl.hidden = true;

    if (!safeUrl) {
      placeholderEl.hidden = false;
      return;
    }

    imgEl.alt = altText || "Template preview";

    imgEl.onload = () => {
      imgEl.hidden = false;
      placeholderEl.hidden = true;
    };

    imgEl.onerror = () => {
      imgEl.hidden = true;
      placeholderEl.hidden = false;
    };

    imgEl.src = safeUrl;
  }

  /* =====================================
     TYPEWRITER
  ===================================== */
  async function typewriterReveal(text, element) {
    element.textContent = "";

    const cursor = document.createElement("span");
    cursor.className = "typing-cursor";
    element.appendChild(cursor);

    const baseDelay = 6;
    const punctuationPause = 90;
    const chunkSize = 3;

    let displayed = "";

    for (let i = 0; i < text.length; i += chunkSize) {
      if (!STATE.isGenerating) return;

      const chunk = text.slice(i, i + chunkSize);
      displayed += chunk;

      element.textContent = displayed;
      element.appendChild(cursor);

      const lastChar = chunk[chunk.length - 1];
      const delay = /[.!?;:]/.test(lastChar) ? punctuationPause : baseDelay;

      await new Promise(r => setTimeout(r, delay));
    }

    cursor.remove();
  }

  /* =====================================
     GENERATE (runs on first generate + on regenerate)
  ===================================== */
  async function handleGenerate() {
    if (STATE.isGenerating) return;

    const promptText = STATE.templateData?.prompt || "";

    if (!promptText) {
      showError("This template has no prompt yet.");
      return;
    }

    hideError();
    STATE.isGenerating = true;

    // Switch to result state (also resets the UI)
    renderResult();

    // Disable regenerate while typing + show spinner
    els.regenerateBtn.disabled = true;
    const originalIcon = els.regenerateBtnIcon.textContent;
    els.regenerateBtnIcon.textContent = "";
    const spinner = document.createElement("span");
    spinner.className = "btn-spinner";
    els.regenerateBtn.appendChild(spinner);

    try {
      STATE.fullPromptText = promptText;

      await typewriterReveal(promptText, els.promptOutput);

      STATE.isRevealed = true;
      els.promptOutput.setAttribute("aria-busy", "false");

    } catch (err) {
      console.error("[IKLens Generate] Reveal failed:", err);
      showError("Something went wrong while revealing the prompt.");
    } finally {
      STATE.isGenerating = false;

      // Restore the regenerate button
      if (spinner.parentNode) spinner.remove();
      els.regenerateBtnIcon.textContent = originalIcon || "🔁";
      els.regenerateBtn.disabled = false;
    }
  }

  /* =====================================
     COPY
  ===================================== */
  async function handleCopy() {
    if (!STATE.fullPromptText) return;

    try {
      await navigator.clipboard.writeText(STATE.fullPromptText);
      showCopyToast();
    } catch (err) {
      showError("Copy failed — please select the text manually.");
    }
  }

  /* =====================================
     BIND
  ===================================== */
  els.backBtn.addEventListener("click", goBack);
  els.generateBtn.addEventListener("click", handleGenerate);
  els.regenerateBtn.addEventListener("click", handleGenerate);
  els.copyBtn.addEventListener("click", handleCopy);

  /* =====================================
     INIT
  ===================================== */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadTemplate, { once: true });
  } else {
    loadTemplate();
  }
</script>
</body>
</html>
