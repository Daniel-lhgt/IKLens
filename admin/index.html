<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050714" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../images/IKLens - AI Image prompting platform.png" />
  <title>Admin Login — IKLens</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <style>
    :root {
      --bg: #050714;
      --surface: #0f1223;
      --card: #151a30;
      --border: rgba(124, 138, 255, 0.14);
      --border-focus: rgba(138, 43, 226, 0.55);
      --text: #eef0ff;
      --text-secondary: #b0b8e6;
      --text-muted: #6b72b0;
      --accent: #8a2be2;
      --accent-bright: #a5aeff;
      --cyan: #00d2ff;
      --error: #f87171;
      --radius: 12px;
      --radius-pill: 9999px;
      --gradient: linear-gradient(135deg, #8a2be2 0%, #00d2ff 100%);
      --gradient-hover: linear-gradient(135deg, #9d4beb 0%, #33dfff 100%);
      --glow: 0 0 25px rgba(138, 43, 226, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left, rgba(138, 43, 226, 0.12), transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(0, 210, 255, 0.08), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .admin-login {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 40px 32px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .admin-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      text-align: center;
    }

    .admin-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: contain;
      background: var(--surface);
      padding: 6px;
      border: 1px solid var(--border);
    }

    .admin-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .admin-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: rgba(138, 43, 226, 0.15);
      border: 1px solid rgba(138, 43, 226, 0.3);
      color: var(--accent-bright);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .admin-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder { color: var(--text-muted); }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.18);
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .password-toggle:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .submit-btn {
      width: 100%;
      min-height: 52px;
      padding: 14px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--gradient);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--glow);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s, opacity 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--gradient-hover);
      box-shadow: 0 12px 32px rgba(138, 43, 226, 0.5);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-box {
      padding: 12px 14px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: var(--radius);
      color: var(--error);
      font-size: 0.85rem;
      line-height: 1.5;
      display: none;
      align-items: flex-start;
      gap: 8px;
    }

    .error-box.visible { display: flex; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .admin-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="admin-login">
    <div class="admin-brand">
      <img
        src="../images/IKLens - AI Image prompting platform.png"
        alt="IKLens"
        class="admin-logo"
      />
      <div>
        <h1 class="admin-title">IKLens Admin</h1>
        <p class="admin-subtitle">Restricted access</p>
      </div>
      <span class="admin-badge">
        <i class="fa-solid fa-shield-halved"></i>
        Admin Area
      </span>
    </div>

    <div id="errorBox" class="error-box" role="alert" aria-live="polite">
      <i class="fa-solid fa-circle-exclamation" style="margin-top: 2px;"></i>
      <span id="errorText"></span>
    </div>

    <form id="adminLoginForm" class="admin-form" novalidate>
      <div class="form-group">
        <label for="adminEmail" class="form-label">Email</label>
        <input
          type="email"
          id="adminEmail"
          class="form-input"
          placeholder="admin@example.com"
          autocomplete="email"
          spellcheck="false"
          required
        />
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="adminPassword"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            style="padding-right: 48px;"
            required
          />
          <button
            type="button"
            class="password-toggle"
            id="togglePassword"
            aria-label="Toggle password visibility"
          >
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <span id="submitLabel">Sign In</span>
      </button>
    </form>

    <p class="admin-footer">
      Only authorised administrators can access this area.<br />
      Non-admin accounts will be signed out.
    </p>
  </div>

<script type="module">
  import {
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  import {
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

  import { auth, database } from "../js/firebase-config.js";

  const form = document.getElementById("adminLoginForm");
  const emailInput = document.getElementById("adminEmail");
  const passwordInput = document.getElementById("adminPassword");
  const submitBtn = document.getElementById("submitBtn");
  const submitLabel = document.getElementById("submitLabel");
  const errorBox = document.getElementById("errorBox");
  const errorText = document.getElementById("errorText");
  const togglePassword = document.getElementById("togglePassword");

  let submitting = false;

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.add("visible");
  }

  function hideError() {
    errorBox.classList.remove("visible");
    errorText.textContent = "";
  }

  function setLoading(loading) {
    submitBtn.disabled = loading;
    submitLabel.innerHTML = loading
      ? '<span class="spinner"></span> Signing in…'
      : "Sign In";
  }

  function friendlyMessage(code) {
    const map = {
      "auth/invalid-credential": "Invalid email or password.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/user-disabled": "This account has been disabled.",
      "auth/too-many-requests": "Too many attempts. Please wait and try again.",
      "auth/network-request-failed": "Network error. Check your connection.",
      "auth/user-not-found": "Invalid email or password.",
      "auth/wrong-password": "Invalid email or password.",
      "auth/operation-not-allowed": "Email sign-in is not enabled.",
      "auth/invalid-api-key": "Configuration error. Contact support."
    };
    return map[code] || "Sign-in failed. Please try again.";
  }

  async function isAdmin(uid) {
    try {
      const snap = await get(ref(database, `admins/${uid}`));
      return snap.exists() && snap.val() === true;
    } catch (error) {
      console.error("[Admin] Failed to check admin status:", error);
      return false;
    }
  }

  togglePassword.addEventListener("click", () => {
    const showing = passwordInput.type === "password";
    passwordInput.type = showing ? "text" : "password";
    const icon = togglePassword.querySelector("i");
    icon.classList.toggle("fa-eye", !showing);
    icon.classList.toggle("fa-eye-slash", showing);
  });

  [emailInput, passwordInput].forEach(el => {
    el.addEventListener("input", hideError);
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (submitting) return;

    hideError();

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError("Please enter a valid email address.");
      emailInput.focus();
      return;
    }

    if (!password) {
      showError("Please enter your password.");
      passwordInput.focus();
      return;
    }

    submitting = true;
    setLoading(true);

    try {
      await setPersistence(auth, browserLocalPersistence);

      const cred = await signInWithEmailAndPassword(auth, email, password);
      const user = cred.user;

      // Verify admin status
      const admin = await isAdmin(user.uid);

      if (!admin) {
        await signOut(auth);
        throw { code: "not-admin" };
      }

      window.location.replace("home.html");

    } catch (error) {
      console.error("[Admin] Login failed:", error);

      if (error?.code === "not-admin") {
        showError("This account is not an administrator. Access denied.");
      } else {
        showError(friendlyMessage(error?.code));
      }

      submitting = false;
      setLoading(false);
    }
  });

  // If already signed in as admin, skip login
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    const admin = await isAdmin(user.uid);
    if (admin) {
      window.location.replace("home.html");
    } else {
      await signOut(auth);
    }
  });
</script>
</body>
</html>
